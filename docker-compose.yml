# Local development services only: PostgreSQL and Redis.
# Django, Celery and the static site run on the host (see README.md).
# Production deployment is documented separately (docs/operations/deployment.md, Stage 1+).
#
#   docker compose up -d
#
name: dewmix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dewmix
      POSTGRES_USER: dewmix
      POSTGRES_PASSWORD: dewmix        # dev-only credentials, not used anywhere else
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dewmix -d dewmix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
