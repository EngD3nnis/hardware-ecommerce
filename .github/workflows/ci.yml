name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dewmix
          POSTGRES_USER: dewmix
          POSTGRES_PASSWORD: dewmix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dewmix -d dewmix"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://dewmix:dewmix@localhost:5432/dewmix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ../requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Production deploy checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-7f3a9c2e1b8d4f6a0e5c9b2d7a1f3e8c4b6d0a9f2e7c1b5d8a3f6e0c9b4
          JWT_SIGNING_KEY: ci-only-2b8e5d1a9c7f3e0b6d4a8c2f1e9b7d5a3c0f8e6b4d2a9c7f5e1b3d8a6c0
          DJANGO_ALLOWED_HOSTS: ci.invalid

      - name: Tests
        run: pytest --cov=apps --cov=config --cov-report=term-missing:skip-covered
